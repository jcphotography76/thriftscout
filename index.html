<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrift Scout | Smart Item Appraisal & Vault</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #111827;
            --bg-input: #1f2937;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent);
        }

        nav button {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        nav button.active {
            background: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        input, select, textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--accent);
            color: var(--bg-dark);
            font-weight: 700;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .results {
            margin-top: 1.5rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .stat-card p {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Thrift<span>Scout</span></div>
        <nav>
            <button onclick="switchView('app')" id="nav-app" class="active">Appraiser</button>
            <button onclick="switchView('vault')" id="nav-vault">Vault</button>
            <button onclick="switchView('settings')" id="nav-settings">Settings</button>
        </nav>
    </header>

    <main>
        <!-- APPRAISER VIEW -->
        <div id="view-app" class="view active">
            <div class="card">
                <h2>Item Reconnaissance</h2>
                <div class="form-group">
                    <label>Gemini API Key</label>
                    <input type="password" id="api-key" placeholder="Enter Gemini API Key">
                </div>
                <div class="form-group">
                    <label>Item Photo</label>
                    <input type="file" id="item-photo" accept="image/*" capture="environment">
                </div>
                <div class="form-group">
                    <label>Cost of Item ($)</label>
                    <input type="number" id="item-cost" placeholder="0.00" step="0.01">
                </div>
                <button class="btn" onclick="analyzeItem()">Evaluate Item</button>

                <div id="results-box" class="results">
                    <h3 id="res-title" style="color:var(--accent); margin-bottom:0.5rem;"></h3>
                    <p id="res-desc" style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1rem;"></p>
                    <div id="res-financials"></div>
                </div>
            </div>
        </div>

        <!-- VAULT VIEW -->
        <div id="view-vault" class="view">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Valuation</h3>
                    <p id="vault-total">$0.00</p>
                </div>
                <div class="stat-card">
                    <h3>Items Logged</h3>
                    <p id="vault-count">0</p>
                </div>
            </div>
            <div class="card">
                <h2>Inventory Vault</h2>
                <div id="vault-list" style="color:var(--text-muted); font-size:0.9rem;">No items stored yet.</div>
            </div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="view-settings" class="view">
            <div class="card">
                <h2>Configuration</h2>
                <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1rem;">Your API key and vault inventory are safely stored locally in your browser storage.</p>
                <button class="btn" style="background:var(--danger); color:white;" onclick="clearVault()">Clear Vault Data</button>
            </div>
        </div>
    </main>

    <script>
        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            document.getElementById('nav-' + viewName).classList.add('active');
            if(viewName === 'vault') loadVault();
        }

        function loadSettings() {
            const savedKey = localStorage.getItem('thrift_api_key');
            if(savedKey) document.getElementById('api-key').value = savedKey;
        }

        document.getElementById('api-key').addEventListener('input', (e) => {
            localStorage.setItem('thrift_api_key', e.target.value.trim());
        });

        async function analyzeItem() {
            const apiKey = document.getElementById('api-key').value.trim();
            const fileInput = document.getElementById('item-photo');
            const cost = parseFloat(document.getElementById('item-cost').value) || 0;

            if(!apiKey) {
                alert('Please enter your Gemini API Key in the settings or field.');
                return;
            }
            if(fileInput.files.length === 0) {
                alert('Please select or capture an item photo.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function() {
                const base64Data = reader.result.split(',')[1];
                const resultsBox = document.getElementById('results-box');
                resultsBox.style.display = 'block';
                document.getElementById('res-title').innerText = 'Analyzing item with Gemini...';
                document.getElementById('res-desc').innerText = '';
                document.getElementById('res-financials').innerHTML = '';

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Analyze this thrift item for resale. Provide JSON with fields: name, description, estimated_market_value (number), disposition (Green/Yellow/Red), reasoning." },
                                    { inline_data: { mime_type: file.type, data: base64Data } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();
                    const textResponse = data.candidates[0].content.parts[0].text;
                    // Clean markdown code blocks if returned
                    const cleanJson = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                    const parsed = JSON.parse(cleanJson);

                    document.getElementById('res-title').innerText = parsed.name;
                    document.getElementById('res-desc').innerText = parsed.description;
                    
                    const estValue = parsed.estimated_market_value || 0;
                    const profit = estValue - cost;
                    const margin = estValue > 0 ? ((profit / estValue) * 100).toFixed(1) : 0;

                    document.getElementById('res-financials').innerHTML = `
                        <p><strong>Market Value:</strong> $${estValue.toFixed(2)}</p>
                        <p><strong>Cost:</strong> $${cost.toFixed(2)}</p>
                        <p><strong>Est. Profit:</strong> $${profit.toFixed(2)} (${margin}%)</p>
                        <p><strong>Disposition:</strong> <span style="color:${parsed.disposition==='Green'?'var(--accent)':parsed.disposition==='Yellow'?'var(--warning)':'var(--danger)'}">${parsed.disposition}</span></p>
                        <button class="btn" style="margin-top:1rem;" onclick="saveToVault('${parsed.name.replace(/'/g, "")}', ${estValue}, ${cost})">Save to Vault</button>
                    `;
                } catch (err) {
                    document.getElementById('res-title').innerText = 'Analysis Error';
                    document.getElementById('res-desc').innerText = err.message;
                }
            };
            reader.readAsDataURL(file);
        }

        function saveToVault(name, value, cost) {
            let vault = JSON.parse(localStorage.getItem('thrift_vault') || '[]');
            vault.push({ name, value, cost, date: new Date().toLocaleDateString() });
            localStorage.setItem('thrift_vault', JSON.stringify(vault));
            alert('Item successfully saved to Vault!');
            switchView('vault');
        }

        function loadVault() {
            let vault = JSON.parse(localStorage.getItem('thrift_vault') || '[]');
            document.getElementById('vault-count').innerText = vault.length;
            const totalVal = vault.reduce((acc, item) => acc + item.value, 0);
            document.getElementById('vault-total').innerText = '$' + totalVal.toFixed(2);

            const listEl = document.getElementById('vault-list');
            if(vault.length === 0) {
                listEl.innerHTML = 'No items stored yet.';
                return;
            }

            listEl.innerHTML = vault.map(item => `
                <div style="background:var(--bg-input); padding:0.75rem; border-radius:6px; margin-bottom:0.5rem; display:flex; justify-content:space-between;">
                    <span><strong>${item.name}</strong> (${item.date})</span>
                    <span style="color:var(--accent);">Val: $${item.value.toFixed(2)}</span>
                </div>
            `).join('');
        }

        function clearVault() {
            if(confirm('Are you sure you want to clear your vault data?')) {
                localStorage.removeItem('thrift_vault');
                loadVault();
            }
        }

        loadSettings();
    </script>
</body>
</html>
