<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrift Scout</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #d4a373;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --danger-color: #ff4444;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: monospace, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--surface-color);
            padding: 15px;
            border-radius: 8px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.5rem; text-align: center; color: var(--primary-color); margin-top: 0; letter-spacing: 2px; }
        .input-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; }
        input, select, button {
            background: #2a2a2a;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus, select:focus { outline: 1px solid var(--primary-color); }
        .vertical-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        button.primary {
            background: var(--primary-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button.primary:active { opacity: 0.8; }
        #camera-preview {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            display: none;
            margin-bottom: 10px;
        }
        .results { margin-top: 15px; font-size: 0.9rem; white-space: pre-wrap; background: #181818; padding: 10px; border-radius: 4px; line-height: 1.4; }
        .flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 9999;
        }
        .flash-overlay.active { opacity: 0.7; }
    </style>
</head>
<body>
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="container">
        <h1>THRIFT SCOUT</h1>
        
        <div class="input-group">
            <label for="apiKeyInput">Gemini API Key (Stored Locally)</label>
            <input type="password" id="apiKeyInput" placeholder="Enter API Key">
        </div>

        <div class="input-group">
            <label for="costInput">Acquisition Cost ($)</label>
            <input type="number" id="costInput" step="0.01" placeholder="0.00">
        </div>

        <div class="input-group">
            <label>Upload Photo / Multi-Scan</label>
            <video id="camera-preview" autoplay playsinline></video>
            <input type="file" id="fileInput" accept="image/*" capture="environment" multiple style="display:none;">
        </div>

        <div class="vertical-buttons">
            <button class="primary" id="snapShotBtn">Snap Shot / Multi-Scan</button>
            <button class="primary" id="runReconBtn">Run AI Valuation</button>
        </div>

        <div class="results" id="outputResults">System ready.</div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKeyInput');
        const costInput = document.getElementById('costInput');
        const fileInput = document.getElementById('fileInput');
        const cameraPreview = document.getElementById('camera-preview');
        const snapShotBtn = document.getElementById('snapShotBtn');
        const runReconBtn = document.getElementById('runReconBtn');
        const outputResults = document.getElementById('outputResults');
        const flashOverlay = document.getElementById('flashOverlay');

        // Load saved API key
        if(localStorage.getItem('gemini_api_key')) {
            apiKeyInput.value = localStorage.getItem('gemini_api_key');
        }
        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        });

        let capturedImages = [];

        // Haptic & Visual Feedback
        function triggerFeedback(highValue = false) {
            if (navigator.vibrate) {
                navigator.vibrate(highValue ? [100, 50, 100, 50, 200] : 100);
            }
            flashOverlay.classList.add('active');
            setTimeout(() => flashOverlay.classList.remove('active'), 200);

            if (highValue) {
                playJackpotAudio();
            }
        }

        function playJackpotAudio() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.value = freq;
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        gain.gain.setValueAtTime(0.1, ctx.currentTime);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.15);
                    }, i * 100);
                });
            } catch(e) {}
        }

        // Camera / File Handling
        snapShotBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                capturedImages = files;
                outputResults.innerText = `${files.length} image(s) loaded and queued for analysis.`;
                triggerFeedback(false);
            }
        });

        // Robust API call with 503 backoff retry
        async function callGeminiWithRetry(payload, apiKey, retries = 3, delay = 2000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (response.ok) return data;
                    if (response.status === 503 && i < retries - 1) {
                        outputResults.innerText = `High demand detected (503). Retrying attempt ${i + 2}...`;
                        await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
                        continue;
                    }
                    throw new Error(data.error?.message || `HTTP error ${response.status}`);
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay));
                }
            }
        }

        // Recon execution via Gemini API
        runReconBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const cost = parseFloat(costInput.value) || 0;

            if (!apiKey) {
                outputResults.innerText = "Error: API Key missing.";
                return;
            }
            if (capturedImages.length === 0) {
                outputResults.innerText = "Error: No images selected.";
                return;
            }

            outputResults.innerText = "Analyzing item with Gemini AI...";

            try {
                const base64Images = await Promise.all(capturedImages.map(file => {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                }));

                const payload = {
                    contents: [{
                        parts: [
                            { text: `Evaluate this item for resale. Acquisition cost is $${cost.toFixed(2)}. Provide estimated market value, projected profit margin, disposition recommendation (Sell/Keep/Monitor), and comp details.` },
                            ...base64Images.map(img => ({
                                inline_data: { mime_type: "image/jpeg", data: img }
                            }))
                        ]
                    }]
                };

                const data = await callGeminiWithRetry(payload, apiKey);
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const resultText = data.candidates[0].content.parts[0].text;
                    outputResults.innerText = resultText;
                    
                    const isHighValue = resultText.toLowerCase().includes("high value") || resultText.toLowerCase().includes("profit");
                    triggerFeedback(isHighValue);
                } else {
                    outputResults.innerText = "Error parsing API response.";
                }
            } catch (err) {
                outputResults.innerText = `API Error: ${err.message}`;
            }
        });
    </script>
</body>
</html>
