<style>
:root{--ink:#0d0f08;--bg:#11140c;--gold:#c6b878;--text:#f2f3e6;--muted:#aab38f;--wood1:#6b4a2b;--wood2:#4a321c;--wood3:#2f1f11}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--text);font-family:Georgia,"Times New Roman",serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3.2vh,28px);padding:16px;background:radial-gradient(ellipse at 50% 38%,#232a17 0%,#11140c 55%,#080a05 100%)}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px);pointer-events:none}
h1{font-size:clamp(1.5rem,5.5vw,2.4rem);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-align:center;font-weight:700;transition:opacity .5s}
.sub{font-size:clamp(.8rem,2.6vw,1rem);color:var(--muted);letter-spacing:.08em;text-align:center;margin-top:-6px;transition:opacity .5s}
.hint{margin-top:22px;font-size:.9rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;animation:pulse 2.2s ease-in-out infinite;transition:opacity .4s}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
/* the tent */
.scene{position:relative;width:min(90vw,440px);aspect-ratio:6/5;transition:transform 1.5s cubic-bezier(.65,0,.35,1);will-change:transform;transform-origin:50% 72%}
.ground{position:absolute;left:-6%;right:-6%;bottom:-3%;height:12%;border-radius:50%;background:radial-gradient(ellipse,#2a2415 0%,#1a170d 55%,rgba(0,0,0,0) 72%)}
.guys{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.guys line{stroke:#a79a6a;stroke-width:1.6;vector-effect:non-scaling-stroke;opacity:.75}
.stake{position:absolute;bottom:1%;width:10px;height:22px;background:linear-gradient(90deg,#6c5a36,#3a2f1a);border-radius:2px;transform:rotate(18deg)}
.tent{position:absolute;inset:0;clip-path:polygon(50% 0,100% 100%,0 100%);
 background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,rgba(0,0,0,.05) 2px 4px),
  repeating-linear-gradient(-45deg,rgba(255,255,255,.03) 0 2px,rgba(0,0,0,.05) 2px 4px),
  linear-gradient(90deg,transparent 24.6%,rgba(0,0,0,.35) 25%,transparent 25.5%,transparent 74.5%,rgba(0,0,0,.35) 75%,transparent 75.4%),
  linear-gradient(180deg,#6a7348 0%,#566038 55%,#3f4828 100%)}
.tent::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.05) 40%,rgba(0,0,0,.35))}
.door{position:absolute;left:0;right:0;top:0;bottom:0;border:0;background:none;cursor:pointer;display:block;outline-offset:4px;padding:0}
.door:focus-visible{outline:3px solid var(--gold)}
.opening{position:absolute;left:33%;width:34%;top:30%;bottom:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.room{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 85%,#ffe9a8 0%,#f3c969 30%,#b9852f 65%,#3a2810 100%)}
.flap{position:absolute;top:0;bottom:0;width:50%;transition:transform 1.5s cubic-bezier(.5,0,.2,1);
 background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,rgba(0,0,0,.06) 2px 4px),linear-gradient(180deg,#788253,#4a5330)}
.fl{left:0;transform-origin:left center;clip-path:polygon(100% 0,0 100%,100% 100%);box-shadow:inset -6px 0 10px rgba(0,0,0,.4)}
.fr{right:0;transform-origin:right center;clip-path:polygon(0 0,100% 100%,0 100%)}
.fr::after,.fl::after{content:"";position:absolute;top:30%;bottom:6%;width:3px;background:repeating-linear-gradient(180deg,#d9cf9a 0 6px,transparent 6px 12px);opacity:.75}
.fl::after{right:2px;transform:skewX(-27deg)}.fr::after{left:2px;transform:skewX(27deg)}
.stencil{position:absolute;left:0;right:0;top:106%;transform:none;text-align:center;font:700 clamp(.55rem,2.2vw,.8rem) Impact,"Arial Narrow",sans-serif;letter-spacing:.28em;color:#d9cf9a;opacity:.85;text-transform:uppercase;pointer-events:none;transition:opacity .4s;left:0}
.ties{position:absolute;top:30%;left:33%;width:34%;height:0;pointer-events:none}
.stage.open .fl{transform:scaleX(.07) skewY(-6deg)}
.stage.open .fr{transform:scaleX(.07) skewY(6deg)}
.stage.open .stencil{opacity:0}
.stage.open .hint,.stage.open h1,.stage.open .sub{opacity:0}
.stage.zoom .scene{transform:scale(16)}
.fade{position:fixed;inset:0;background:#fff3cf;opacity:0;pointer-events:none;transition:opacity .7s ease}
.stage.zoom ~ .fade{opacity:1;transition-delay:.55s}
.foot{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:.72rem;color:var(--muted);letter-spacing:.06em;transition:opacity .5s}
.stage.open .foot{opacity:0}
.skip{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.door,.scene,.fade{transition-duration:.01s!important}.hint{animation:none}}
</style></head>
<body>
<main class="stage" id="stage">
  <h1>Thrift Scout</h1>
  <div class="sub">Independent &middot; Woman Owned &amp; Operated &middot; Adults 18+</div>
  <div class="scene" id="scene">
    <div class="ground"></div>
    <svg class="guys" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="50" y1="1" x2="-3" y2="97"/><line x1="50" y1="1" x2="103" y2="97"/></svg>
    <div class="stake" style="left:-4%"></div><div class="stake" style="right:-4%;transform:rotate(-18deg)"></div>
    <div class="tent"></div>
    <div class="stencil">Thrift Scout &middot; Beta</div>
    <button class="door" id="door" aria-label="Open the tent flap and enter Thrift Scout">
      <span class="opening"><span class="room"></span><span class="flap fl"></span><span class="flap fr"></span></span>
    </button>
  </div>
  <div class="hint" id="hint">Tap the tent</div>
  <div class="foot"><a class="skip" href="home.html">Skip and enter</a></div>
</main>
<div class="fade" id="fade"></div>
<noscript><p style="position:fixed;bottom:60px;left:0;right:0;text-align:center"><a style="color:#c6b878" href="home.html">Enter Thrift Scout</a></p></noscript>
<script>
(function(){
  var stage=document.getElementById('stage'),door=document.getElementById('door'),go=false,T='home.html';
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function enter(){
    if(go)return; go=true;
    if(reduce){location.href=T;return;}
    stage.classList.add('open');
    setTimeout(function(){stage.classList.add('zoom');},900);
    setTimeout(function(){location.href=T;},2300);
  }
  door.addEventListener('click',enter);
  window.addEventListener('pageshow',function(e){if(e.persisted){go=false;stage.classList.remove('open','zoom');}});
})();
</script>
</body></html>
