<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrift Scout • Core Workspace</title>
    <style>
        :root {
            --bg: #06090f;
            --card-bg: #111827;
            --surface: #1f2937;
            --border: #374151;
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #f59e0b;
            --accent: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            max-width: 600px;
            width: 100%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .brand { font-weight: 800; font-size: 1.2rem; color: var(--text); }
        .brand span { color: var(--primary); }

        .card {
            max-width: 600px;
            width: 100%;
            margin: 0 auto 16px auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            background: var(--primary);
            color: #06090f;
        }
        .btn:hover { opacity: 0.9; }

        .input-field {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 1rem;
        }

        label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 6px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">THRIFT<span>SCOUT</span></div>
        <button class="btn" style="width: auto; padding: 8px 16px; font-size: 0.85rem;" id="settingsBtn">API Settings</button>
    </header>

    <main style="display: flex; flex-direction: column; gap: 16px;">
        <div class="card">
            <h2>Item Appraisal</h2>
            <div>
                <label>Upload Photo</label>
                <input type="file" id="photoInput" class="input-field" accept="image/*">
            </div>
            <div>
                <label>Cost Basis ($)</label>
                <input type="number" id="costInput" class="input-field" value="0.00" step="0.01">
            </div>
            <button class="btn" id="evaluateBtn">Run AI Valuation</button>
        </div>

        <div class="card" id="resultCard" style="display:none;">
            <h3 id="resTitle" style="color: var(--primary);"></h3>
            <p id="resDesc" style="color: var(--text-muted);"></p>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; padding:20px;">
        <div class="card" style="max-width:400px;">
            <h3>Configure API Key</h3>
            <div>
                <label>Gemini API Key</label>
                <input type="password" id="apiKeyInput" class="input-field" placeholder="AIzaSy...">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:var(--surface); color:var(--text);" id="cancelModalBtn">Cancel</button>
                <button class="btn" id="saveKeyBtn">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Direct, foolproof event bindings with zero overlay conflicts
        document.getElementById('settingsBtn').onclick = () => {
            document.getElementById('apiKeyInput').value = localStorage.getItem('thrift_api_key') || '';
            document.getElementById('settingsModal').style.display = 'flex';
        };

        document.getElementById('cancelModalBtn').onclick = () => {
            document.getElementById('settingsModal').style.display = 'none';
        };

        document.getElementById('saveKeyBtn').onclick = () => {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('thrift_api_key', key);
            document.getElementById('settingsModal').style.display = 'none';
            alert('API key saved successfully.');
        };

        document.getElementById('evaluateBtn').onclick = async () => {
            const key = localStorage.getItem('thrift_api_key');
            const fileInput = document.getElementById('photoInput');
            const cost = document.getElementById('costInput').value;

            if (!key) {
                alert('Please enter your Gemini API key in settings first.');
                document.getElementById('settingsModal').style.display = 'flex';
                return;
            }
            if (fileInput.files.length === 0) {
                alert('Please select a photo to evaluate.');
                return;
            }

            alert('Photo selected! Ready to process appraisal with cost basis: $' + cost);
        };
    </script>
</body>
</html>
