<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrift Scout • AI Appraisal Workspace</title>
    <style>
        :root {
            --bg: #06090f;
            --card-bg: #111827;
            --surface: #1f2937;
            --border: #374151;
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #f59e0b;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-bottom: 90px;
        }

        header {
            max-width: 600px;
            width: 100%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .brand { font-weight: 800; font-size: 1.2rem; color: var(--text); cursor: pointer; }
        .brand span { color: var(--primary); }

        .card {
            max-width: 600px;
            width: 100%;
            margin: 0 auto 16px auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            background: var(--primary);
            color: #06090f;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }

        .input-field {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }
        .input-field:focus { border-color: var(--primary); }

        label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 6px; }

        .preview-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--primary);
            margin-top: 10px;
        }

        /* Progress Bar Animation */
        .progress-box {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--surface);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.4s ease;
            animation: pulseProgress 1.5s infinite;
        }
        @keyframes pulseProgress {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .metric-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }
        .metric-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
        .metric-val { font-size: 1.1rem; font-weight: 800; color: var(--text); }
        .metric-val.profit { color: var(--accent); }

        .bottom-dock {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(17, 24, 39, 0.95);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .dock-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .dock-btn.active { color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="location.reload()">THRIFT<span>SCOUT</span></div>
        <button class="btn" style="width: auto; padding: 8px 16px; font-size: 0.85rem;" id="settingsBtn" type="button">API Settings</button>
    </header>

    <main style="display: flex; flex-direction: column; gap: 16px;">
        <div class="card" id="scoutView">
            <h2>Item Appraisal Workspace</h2>
            <div>
                <label>Upload Photo</label>
                <input type="file" id="photoInput" class="input-field" accept="image/*">
                <div id="previewContainer"></div>
            </div>
            <div>
                <label>Cost Basis ($)</label>
                <input type="number" id="costInput" class="input-field" value="0.00" step="0.01">
            </div>
            <button class="btn" id="evaluateBtn" type="button">Run AI Valuation</button>

            <!-- Progress Bar -->
            <div class="progress-box" id="progressBox">
                <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--primary); font-weight:700;">
                    <span id="progressText">Analyzing item with Gemini AI...</span>
                    <span>AI Vision</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 75%;"></div>
                </div>
            </div>
        </div>

        <!-- RESULTS CARD -->
        <div class="card" id="resultCard" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 id="resTitle" style="color: var(--primary); font-size: 1.1rem;">Item Name</h3>
                <span id="resBadge" style="font-size:0.75rem; font-weight:700; background:rgba(16,185,129,0.15); color:var(--accent); border:1px solid var(--accent); padding:3px 8px; border-radius:6px;">BUY</span>
            </div>
            <p id="resDesc" style="color: var(--text-muted); font-size: 0.85rem; line-height: 1.4;"></p>
            
            <div class="metric-grid">
                <div class="metric-box">
                    <div class="metric-label">Estimated Resale</div>
                    <div class="metric-val" id="resVal">$0.00</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Est. Net Profit</div>
                    <div class="metric-val profit" id="resProfit">$0.00</div>
                </div>
            </div>

            <a id="resEbayLink" href="#" target="_blank" class="btn" style="text-align:center; text-decoration:none; margin-top:6px; background:var(--surface); color:var(--text); border:1px solid var(--border);">Search Market Comps</a>
        </div>

        <div class="card" id="vaultView" style="display:none;">
            <h2>Inventory Vault</h2>
            <div id="vaultList" style="color: var(--text-muted); font-size: 0.9rem;">Your evaluated items will appear here.</div>
        </div>
    </main>

    <nav class="bottom-dock">
        <button class="dock-btn active" id="dockScout" type="button">⚡ SCOUT</button>
        <button class="dock-btn" id="dockVault" type="button">📦 VAULT</button>
    </nav>

    <!-- Settings Modal -->
    <div id="settingsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; padding:20px; z-index:200;">
        <div class="card" style="max-width:400px;">
            <h3>Configure API Key</h3>
            <div>
                <label>Gemini API Key</label>
                <input type="password" id="apiKeyInput" class="input-field" placeholder="AIzaSy...">
            </div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn" style="background:var(--surface); color:var(--text);" id="cancelModalBtn" type="button">Cancel</button>
                <button class="btn" id="saveKeyBtn" type="button">Save</button>
            </div>
        </div>
    </div>

    <script>
        let base64Image = null;

        window.addEventListener('DOMContentLoaded', () => {
            // Navigation
            document.getElementById('dockScout').onclick = () => {
                document.getElementById('dockScout').classList.add('active');
                document.getElementById('dockVault').classList.remove('active');
                document.getElementById('scoutView').style.display = 'flex';
                document.getElementById('vaultView').style.display = 'none';
            };

            document.getElementById('dockVault').onclick = () => {
                document.getElementById('dockVault').classList.add('active');
                document.getElementById('dockScout').classList.remove('active');
                document.getElementById('vaultView').style.display = 'flex';
                document.getElementById('scoutView').style.display = 'none';
            };

            // Modal
            document.getElementById('settingsBtn').onclick = () => {
                document.getElementById('apiKeyInput').value = localStorage.getItem('thrift_api_key') || '';
                document.getElementById('settingsModal').style.display = 'flex';
            };
            document.getElementById('cancelModalBtn').onclick = () => {
                document.getElementById('settingsModal').style.display = 'none';
            };
            document.getElementById('saveKeyBtn').onclick = () => {
                const key = document.getElementById('apiKeyInput').value.trim();
                localStorage.setItem('thrift_api_key', key);
                document.getElementById('settingsModal').style.display = 'none';
                alert('API key saved successfully.');
            };

            // Photo loader
            document.getElementById('photoInput').onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        base64Image = event.target.result;
                        const container = document.getElementById('previewContainer');
                        container.innerHTML = '<img src="' + base64Image + '" class="preview-thumb">';
                    };
                    reader.readAsDataURL(file);
                }
            };

            // AI Valuation Engine
            document.getElementById('evaluateBtn').onclick = async () => {
                const key = localStorage.getItem('thrift_api_key');
                const cost = parseFloat(document.getElementById('costInput').value) || 0;

                if (!key) {
                    alert('Please enter your Gemini API key in settings first.');
                    document.getElementById('settingsModal').style.display = 'flex';
                    return;
                }
                if (!base64Image) {
                    alert('Please upload a photo of the item first.');
                    return;
                }

                const progressBox = document.getElementById('progressBox');
                progressBox.style.display = 'flex';
                document.getElementById('resultCard').style.display = 'none';

                try {
                    const promptText = "Analyze this thrift item for resale. Return ONLY valid JSON with exactly keys: name (string), description (string), estimated_market_value (number), disposition (Green, Yellow, or Red), reasoning (string). No markdown backticks.";
                    
                    const base64Data = base64Image.split(',')[1];
                    const mimeType = base64Image.split(';')[0].split(':')[1] || 'image/jpeg';

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: promptText },
                                    { inline_data: { mime_type: mimeType, data: base64Data } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();
                    progressBox.style.display = 'none';

                    if (data.error) throw new Error(data.error.message);

                    let rawText = data.candidates[0].content.parts[0].text;
                    rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                    const parsed = JSON.parse(rawText);

                    const marketVal = parseFloat(parsed.estimated_market_value) || 25.00;
                    const profitVal = marketVal - cost - (marketVal * 0.1325); // accounting for 13.25% eBay fees

                    document.getElementById('resTitle').textContent = parsed.name;
                    document.getElementById('resDesc').textContent = parsed.description + ' — ' + parsed.reasoning;
                    document.getElementById('resVal').textContent = '$' + marketVal.toFixed(2);
                    document.getElementById('resProfit').textContent = '$' + profitVal.toFixed(2) + ' (' + ((profitVal/marketVal)*100).toFixed(0) + '%)';
                    
                    const badge = document.getElementById('resBadge');
                    badge.textContent = parsed.disposition + ' Disposition';

                    document.getElementById('resEbayLink').href = `https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(parsed.name)}&LH_Sold=1&LH_Complete=1`;
                    document.getElementById('resultCard').style.display = 'flex';
                    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });

                } catch (err) {
                    progressBox.style.display = 'none';
                    alert('AI Evaluation Error: ' + err.message);
                }
            };
        });
    </script>
</body>
</html>
